version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: octofit-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: octofit-tracker
    volumes:
      - mongodb_data:/data/db
    networks:
      - octofit-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: octofit-backend
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: development
      PORT: 8000
      MONGODB_URI: mongodb://mongodb:27017/octofit-tracker
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - octofit-network
    volumes:
      - ./backend/src:/app/src
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: octofit-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    networks:
      - octofit-network
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev

volumes:
  mongodb_data:

networks:
  octofit-network:
    driver: bridge
